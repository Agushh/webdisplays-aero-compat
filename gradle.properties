# Gradle settings
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=true
org.gradle.debug=false

# Parchment mappings for better readable decompiled code
neogradle.subsystems.parchment.minecraftVersion=1.21.1
neogradle.subsystems.parchment.mappingsVersion=2024.11.17

# Minecraft/NeoForge versions
minecraft_version=1.21.1
minecraft_version_range=[1.21.1,1.22)
# Bumped from 21.1.176: Sable/Aeronautics/offroad/simulated all declare "requires neoforge
# 21.1.228 or above" in their own mods.toml (seen directly in the "Error loading mods" screen
# when they were added to run/mods). 21.1.228 satisfies every mod we're testing with (Create
# only needs 21.1.219, Ponder only 21.1.206).
neo_version=21.1.228
neo_version_range=[21.1.0,)
loader_version_range=[4,)

# Mod Properties
#
# Fork identity: modId is intentionally kept identical to the upstream CinemaMod/webdisplays
# mod ("webdisplays") so this fork is a true drop-in replacement — existing worlds that already
# have WebDisplays screens placed keep working (block/BE registry names are derived from modId,
# so changing it would turn every placed screen into a "missing mod" block). This means this fork
# can NEVER be installed alongside the original WebDisplays (NeoForge will refuse to load two
# mods with the same modId) — that's intentional, it's meant to replace it, not supplement it.
# mod_name is what actually distinguishes this on CurseForge/in the Mods list, so IT is what
# carries the "fork" branding instead.
mod_id=webdisplays
mod_name=WebDisplays Fork - Aeronautics/Sable/Create Compat
mod_license=MIT
mod_version=2.6.0-aero.1-1.21.1
mod_group_id=net.montoyo.wd
# TODO(agustin): replace "<your name/handle>" with whatever you want credited as (CurseForge
# username, GitHub handle, etc.) — the rest of this list is the original mod's authors and should
# stay, per the MIT license's "include the copyright notice" requirement (see LICENSE).
mod_authors=montoyo, GiantLuigi4, ds58, Mysticpasta1, WaterPicker, CinemaMod Group, BrotherBill, <your name/handle> (fork maintainer)
mod_description=Fork of WebDisplays with fixes for Sable sub-levels (Create Aeronautics, Offroad, Simulated, etc.): screens render and are clickable inside moving vehicles, with correct pixel-accurate interaction at Sable's extreme plot-grid coordinates.

# MCEF dependency version (Keksuccino's fork — see build.gradle)
mcef_version=2.2.0-1.21.1

# Create version — COMPILE-TIME ONLY (see build.gradle's "Create compat" comment).
#
# IMPORTANT: maven.createmod.net does NOT publish plain release versions like "6.0.11" —
# per Create's own docs, release jars only go to CurseForge/Modrinth, while the Maven only gets
# automatic CI builds, which all have a build number suffix (e.g. "6.0.11-313"). So this can
# NEVER just be "6.0.11" — Gradle will fail to resolve it (that's the "Could Not Resolve
# com.simibubi.create:create-1.21.1:6.0.11" error).
#
# 6.0.11-313 was the newest CI build for 6.0.11 as of writing. If Gradle ever fails to resolve
# this again (old CI builds can eventually get pruned), grab the newest one from either:
#   - https://mvnrepository.com/artifact/com.simibubi.create/create-1.21.1  (just browse versions)
#   - https://maven.createmod.net/com/simibubi/create/create-1.21.1/ (raw directory listing)
# and paste its exact version string here. This is compileOnly — the exact build never matters,
# it only has to be recent enough to contain VirtualRenderWorld (which has existed for years).
create_version=6.0.11-313

# Sable Companion version — jar-in-jar'd into our mod (see build.gradle's "Sable compat"
# dependency). 1.6.0 is the latest release as of writing; bump freely, it's a tiny, stable API.
sable_companion_version=1.6.0
